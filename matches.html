<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>读取对局纪录 · 桌游实验室</title><link rel="stylesheet" href="account.css?v=2"></head><body><header><a href="game.html">← 返回对战准备</a><a href="./">桌游实验室</a></header><main><h1>读取对局纪录</h1><p class="intro">把那一局，再走一遍。</p><p>选择之前保存的对局文件。系统会根据种子和行动记录逐步重算，核对合法性、结束状态和比分。文件只在当前设备处理，不上传服务器。回放核验后可查看完整信息。</p><label for="replay-file">读取对局文件（JSON，最大20MB）</label><input id="replay-file" type="file" accept=".json,application/json"><p id="message" role="status">请选择一场完整结束的对局纪录。</p></main><script type="module" src="matches.js?v=2"></script></body></html>
