<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的游戏桌 · 路克球的桌游实验室</title><link rel="icon" href="assets/lab-mark.svg"><link rel="stylesheet" href="account.css?v=3"></head><body>
<header><a href="./">← 桌游实验室</a><a href="game.html">开一局 ↗</a></header><main><p class="eyebrow">YOUR TABLE</p><h1>我的游戏桌</h1><p class="intro">每一场认真玩完的对局，都值得回看。</p><p id="message" role="status" aria-live="polite"></p>
<section id="auth" class="surface"><div class="tabs"><button id="login-tab" aria-pressed="true">邮箱登录</button><button id="register-tab" aria-pressed="false">注册账号</button></div><p id="mail-status" role="status"></p><form id="account-form">
<label id="email-row">邮箱<input id="email" type="email" autocomplete="email" maxlength="254" required placeholder="你常用的邮箱"></label>
<label id="code-row">邮箱验证码<div class="code-field"><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="6位数字"><button id="send-code" type="button">获取验证码</button></div></label>
<label id="username-row" hidden>账号名<input id="username" name="username" autocomplete="username" minlength="3" maxlength="24" placeholder="中文、字母、数字或下划线"></label><label id="password-row" hidden>密码<input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="至少10个字符"></label>
<label id="consent-row" class="check" hidden><input id="consent" type="checkbox">我了解：邮箱用于验证身份、登录及找回密码；账号和完整对局会保存到站点数据库，供本人回放及站点管理员分析。不收集手机号。</label><button class="primary" id="submit">邮箱验证码登录</button><div class="auth-links"><button id="password-login" type="button">账号密码登录</button><button id="reset-tab" type="button">忘记密码</button></div><small>注册无需邀请码。验证码10分钟内有效，请勿向他人透露。密码请使用独立密码。</small></form></section>
<section id="profile" hidden><div class="section-title"><h2 id="welcome"></h2><button id="logout">退出登录</button></div><p>仅保存登录后开始、并按规则完整结束的宝可梦对局。游客对局不会上传。</p><div id="matches" class="matches"></div>
<section class="surface maintenance"><h2>登录邮箱</h2><p id="bound-email"></p><form id="bind-email-form" hidden><label>邮箱<input id="bind-email" type="email" autocomplete="email" maxlength="254" required></label><label>当前密码<input id="bind-password" type="password" autocomplete="current-password" maxlength="128" required></label><button id="bind-send" type="button">获取绑定验证码</button><label>邮箱验证码<input id="bind-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button id="bind-submit">验证并绑定邮箱</button></form></section>
<section class="surface maintenance" aria-labelledby="password-title"><h2 id="password-title">修改密码</h2><p>修改后，所有设备都需要重新登录。</p><form id="change-password-form"><label>当前密码<input id="current-password" type="password" autocomplete="current-password" maxlength="128" required></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>再次输入新密码<input id="repeat-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button id="change-password-submit" type="submit">修改并退出登录</button></form></section>
<details class="surface maintenance"><summary>注销账号</summary><p>注销后，该账号和站点数据库中的云端对局将被删除，无法撤销。浏览器本地记录及已导出文件不受影响，历史备份不会立即清除。</p><form id="delete-account-form"><label>输入当前账号名<input id="delete-confirmation" autocomplete="off" maxlength="24" required></label><label>输入当前密码<input id="delete-password" type="password" autocomplete="current-password" maxlength="128" required></label><label class="check"><input id="delete-consent" type="checkbox" required>我确认注销账号并删除云端对局。</label><button id="delete-account-submit" type="submit">永久注销账号</button></form></details>
</section></main><script type="module" src="account.js?v=4"></script></body></html>
