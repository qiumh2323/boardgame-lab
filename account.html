<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的游戏桌 · 路克球的桌游实验室</title><link rel="icon" href="assets/lab-mark.svg"><link rel="stylesheet" href="account.css?v=1"></head><body>
<header><a href="./">← 桌游实验室</a><a href="game.html">开一局 ↗</a></header><main><p class="eyebrow">YOUR TABLE</p><h1>我的游戏桌</h1><p class="intro">每一场认真玩完的对局，都值得回看。</p><p id="message" role="status" aria-live="polite"></p>
<section id="auth" class="surface"><div class="tabs"><button id="login-tab" aria-pressed="true">登录</button><button id="register-tab" aria-pressed="false">注册账号</button></div><form id="account-form"><label>账号<input id="username" name="username" autocomplete="username" minlength="3" maxlength="24" required placeholder="中文、字母、数字或下划线"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="至少10个字符"></label><label id="consent-row" class="check" hidden><input id="consent" type="checkbox">我了解：登录后新开始的完整对局会保存到站点数据库，供本人回放及站点管理员分析。未完成对局不上传，不收集手机号。</label><button class="primary" id="submit">登录</button><small>请使用独立密码，不要复用重要账号密码。暂不支持短信、微信或找回密码。</small></form></section>
<section id="profile" hidden><div class="section-title"><h2 id="welcome"></h2><button id="logout">退出登录</button></div><p>仅保存登录后开始、并按规则完整结束的宝可梦对局。游客对局不会上传。</p><div id="matches" class="matches"></div></section></main><script type="module" src="account.js?v=1"></script></body></html>
